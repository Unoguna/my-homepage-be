server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:myhome}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: info
